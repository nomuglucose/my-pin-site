<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Glucose Control & Diet Items</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .btn-box {
            flex: 1;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .btn-box h2 {
            font-size: 18px;
            margin-top: 0;
        }
        .btn-box p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .link-btn {
            display: block;
            padding: 15px 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        /* 日本人向け（楽天カラー） */
        .btn-jp .link-btn {
            background-color: #bf0000;
            color: #fff;
        }
        .btn-jp .link-btn:hover {
            background-color: #990000;
        }
        /* 外国人向け（Amazonカラー） */
        .btn-en .link-btn {
            background-color: #ff9900;
            color: #111;
        }
        .btn-en .link-btn:hover {
            background-color: #e68a00;
        }
        /* スマホ対応 */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>血糖値コントロール・おすすめ愛用品<br><span style="font-size: 16px; color:#888;">Blood Glucose Control & Diet Items</span></h1>

    <div class="container">
        <div class="btn-box btn-jp">
            <div>
                <h2>For Japanese</h2>
                <p>実際に使って血糖値の上昇が緩やかだった、おすすめの低糖質食品やサプリ、お茶を楽天ROOMでまとめています！</p>
            </div>
            <a href="https://room.rakuten.co.jp/room_6816223819/collections" target="_blank" rel="noopener" class="link-btn">楽天ROOMコレクションを見る</a>
        </div>

        <div class="btn-box btn-en">
            <div>
                <h2>For Global Users</h2>
                <p>Recommended items for blood glucose control and healthy diet available on Amazon. (Low-carb snacks, supplements, teas, etc.)</p>
            </div>
            <a href="#" id="amazon-link" target="_blank" rel="noopener" class="link-btn">Loading...</a>
        </div>
    </div>

    <script>
        // 同じ階層にある amazon_link_list.txt を読み込む
        fetch('amazon_link_list.txt')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(data => {
                // テキストを改行ごとに区切って配列にする（空行やスペースを排除）
                const links = data.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.startsWith('https://'));

                if (links.length > 0) {
                    // ランダムに1つ選ぶ
                    const randomIndex = Math.floor(Math.random() * links.length);
                    const selectedLink = links[randomIndex];

                    // ボタンの文字とリンク先を書き換える
                    const amazonBtn = document.getElementById('amazon-link');
                    amazonBtn.href = selectedLink;
                    amazonBtn.textContent = 'Check Diet Items on Amazon';
                } else {
                    document.getElementById('amazon-link').textContent = 'No Items Available';
                }
            })
            .catch(error => {
                console.error('Error fetching the link list:', error);
                document.getElementById('amazon-link').textContent = 'Error Loading Items';
            });
    </script>

</body>
</html>
